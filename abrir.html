<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="description" content="Acceso oficial a la tienda online ATLE. Ropa deportiva femenina en Venezuela.">
  <link rel="icon" href="/logos/ATLE_symbol_negro.svg" type="image/svg+xml">
  <title>ATLE | Tienda online</title>
  <style>
    :root { color-scheme: light; --black:#111; --white:#fff; --gray:#777; --line:#e8e8e8; }
    * { box-sizing:border-box; }
    html { min-height:100%; background:var(--white); }
    body {
      margin:0; min-height:100svh; padding:28px 22px calc(22px + env(safe-area-inset-bottom));
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:var(--white); color:var(--black); font-family:Arial,Helvetica,sans-serif;
    }
    main { width:min(100%,390px); margin:auto; display:flex; flex-direction:column; align-items:center; text-align:center; }
    .brand { display:block; width:min(76%,270px); height:auto; margin:0 auto 48px; }
    .rule { width:34px; height:1px; background:#111; margin:0 auto 25px; }
    .cta {
      appearance:none; -webkit-appearance:none; display:flex; align-items:center; justify-content:center; gap:15px;
      width:100%; min-height:58px; padding:17px 22px; border:1px solid var(--black); border-radius:2px;
      background:var(--black); color:var(--white); text-decoration:none; text-transform:uppercase;
      letter-spacing:.13em; font-size:11px; line-height:1.4; font-weight:700; cursor:pointer;
      transition:background .18s ease, color .18s ease;
    }
    .cta:hover { background:#2a2a2a; }
    .cta:focus-visible { outline:2px solid var(--black); outline-offset:4px; }
    .arrow { font-size:17px; line-height:1; font-weight:400; }
    .fallback { display:none; margin:18px 0 0; max-width:320px; color:#5f5f5f; font-size:12px; line-height:1.7; }
    .fallback strong { color:#222; }
    footer { width:100%; text-align:center; padding-top:26px; color:#888; font-size:9px; letter-spacing:.2em; text-transform:uppercase; }
    @media (max-width:380px) { .brand { width:min(80%,245px); margin-bottom:40px; } .cta { min-height:55px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none !important; } }
  </style>
</head>
<body>
  <main>
    <img class="brand" src="/logos/ATLE_full_negro.svg" alt="ATLE — Hecha para tu ritmo" width="260" height="84">
    <div class="rule" aria-hidden="true"></div>
    <a class="cta" id="enter-store" href="https://atleoficial.vercel.app/">
      <span>Entrar a la tienda</span><span class="arrow" aria-hidden="true">↗</span>
    </a>
    <p class="fallback" id="fallback" role="status" aria-live="polite">Si no se abrió el navegador externo, toca el menú <strong>⋯</strong> de Instagram y selecciona <strong>Abrir en Safari</strong>. En Android, usa el menú <strong>⋮</strong> y elige abrir en Chrome o en el navegador externo.</p>
  </main>
  <footer>Venezuela · Tienda online</footer>
  <script>
    (() => {
      'use strict';
      const storeUrl = 'https://atleoficial.vercel.app/';
      const button = document.getElementById('enter-store');
      const fallback = document.getElementById('fallback');
      const ua = navigator.userAgent || '';
      const isInstagram = /Instagram|InstagramLite/i.test(ua);
      const isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
      const isAndroid = /Android/i.test(ua);

      // No se realiza ninguna redirección al cargar. Solo se intenta salir del navegador interno tras pulsar el botón.
      button.addEventListener('click', (event) => {
        if (isInstagram && isIOS) {
          event.preventDefault();
          const externalUrl = 'instagram://extbrowser/?url=' + encodeURIComponent(storeUrl);
          window.location.href = externalUrl;
          window.setTimeout(() => {
            if (document.visibilityState === 'visible') fallback.style.display = 'block';
          }, 1400);
          return;
        }
        if (isInstagram && isAndroid) {
          event.preventDefault();
          const intentUrl = 'intent://atleoficial.vercel.app/#Intent;scheme=https;action=android.intent.action.VIEW;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(storeUrl) + ';end';
          window.location.href = intentUrl;
          window.setTimeout(() => {
            if (document.visibilityState === 'visible') fallback.style.display = 'block';
          }, 1400);
          return;
        }
        // Fuera de Instagram, el enlace normal abre la tienda directamente.
        button.href = storeUrl;
      });
    })();
  </script>
</body>
</html>
